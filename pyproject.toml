[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-engine"
version = "0.1.0"
description = "AI-native game development platform: Blender authoring + Godot runtime, CLI/MCP control."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Universal Game Engine project" }]
license = { text = "Proprietary / see THIRD_PARTY_NOTICES.md" }

[project.scripts]
universal-engine = "universal_engine.cli:main"

[tool.setuptools.packages.find]
include = ["universal_engine*"]
