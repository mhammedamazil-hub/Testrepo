    <rect x="74.8" y="174.8" width="620.4" height="620.4"
      fill="none" stroke="#8A8578" stroke-opacity=".55" stroke-dasharray="8 8" stroke-width="1.2"/>

    
      <text x="830" y="250" font-family="JetBrains Mono" font-size="14" letter-spacing="4" fill="#D8542A">01 · GEOMETRY</text>
      <text x="830" y="284" font-family="Inter Tight" font-size="15.5" fill="#F2EDE4" fill-opacity=".82">Field: full square, no radius.</text><text x="830" y="310" font-family="Inter Tight" font-size="15.5" fill="#F2EDE4" fill-opacity=".82">Door: 300 units wide, semicircular head.</text><text x="830" y="336" font-family="Inter Tight" font-size="15.5" fill="#F2EDE4" fill-opacity=".82">Radius = ½ opening — a true arch.</text><text x="830" y="362" font-family="Inter Tight" font-size="15.5" fill="#F2EDE4" fill-opacity=".82">Springing line: 120 above centre.</text><text x="830" y="388" font-family="Inter Tight" font-size="15.5" fill="#F2EDE4" fill-opacity=".82">Legs run past the foot: it is a passage.</text>
      <text x="1430" y="250" font-family="JetBrains Mono" font-size="14" letter-spacing="4" fill="#D8542A">02 · CLEAR SPACE</text>
      <text x="1430" y="284" font-family="Inter Tight" font-size="15.5" fill="#F2EDE4" fill-opacity=".82">Keep 0.16 × block on all sides.</text><text x="1430" y="310" font-family="Inter Tight" font-size="15.5" fill="#F2EDE4" fill-opacity=".82">No type, rule or image inside.</text><text x="1430" y="336" font-family="Inter Tight" font-size="15.5" fill="#F2EDE4" fill-opacity=".82">The mark may bleed only at the foot.</text>
      <text x="830" y="490" font-family="JetBrains Mono" font-size="14" letter-spacing="4" fill="#D8542A">03 · COLOUR</text>
      <text x="830" y="524" font-family="Inter Tight" font-size="15.5" fill="#F2EDE4" fill-opacity=".82">Ink field, paper door. That is the mark.</text><text x="830" y="550" font-family="Inter Tight" font-size="15.5" fill="#F2EDE4" fill-opacity=".82">Paper field inverts it exactly.</text><text x="830" y="576" font-family="Inter Tight" font-size="15.5" fill="#F2EDE4" fill-opacity=".82">Ember is a signal, never a field.</text>
      <text x="1430" y="490" font-family="JetBrains Mono" font-size="14" letter-spacing="4" fill="#D8542A">04 · MINIMUM SIZE</text>
      <text x="1430" y="524" font-family="Inter Tight" font-size="15.5" fill="#F2EDE4" fill-opacity=".82">32 px digital, door widened below that.</text><text x="1430" y="550" font-family="Inter Tight" font-size="15.5" fill="#F2EDE4" fill-opacity=".82">8 mm print, at which the door closes.</text><text x="1430" y="576" font-family="Inter Tight" font-size="15.5" fill="#F2EDE4" fill-opacity=".82">Never outline, glow or bevel it.</text>

