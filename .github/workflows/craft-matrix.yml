name: craft-matrix
on: workflow_dispatch
permissions:
  contents: write
jobs:
  wordcraft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: wordcraft headless probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exec 2>&1
          OUT="$GITHUB_WORKSPACE/craft-demo/wordcraft"; mkdir -p "$OUT"
          LOG="$OUT/REPORT.md"
          echo "# wordcraft @ v0.18.1" > "$LOG"; echo '```' >> "$LOG"
          cd /tmp; rm -rf wordcraft; mkdir wordcraft; cd wordcraft
          gh release download v0.18.1 -R storytold/wordcraft -p '*.tar.gz' -D . >> "$LOG" 2>&1
          for f in *.tar.gz; do case "$f" in *linux-x86_64.tar.gz) tar xzf "$f" >> "$LOG" 2>&1;; esac; done
          echo "[extract done]" >> "$LOG"
          find . -maxdepth 3 -type f -perm -u+x ! -name '*.so*' >> "$LOG" 2>&1
          CLI=$(find . -maxdepth 3 -type f -name 'wordcraft-cli' -perm -u+x | head -1)
          echo "binary: $CLI" >> "$LOG"
          if [ -n "$CLI" ]; then
            echo '$ --version' >> "$LOG"; timeout 120 "$CLI" --version >> "$LOG" 2>&1; echo "[exit $?]" >> "$LOG"
            echo '$ --help' >> "$LOG"; timeout 120 "$CLI" --help >> "$LOG" 2>&1; echo "[exit $?]" >> "$LOG"
          else
            echo "no wordcraft-cli found; listing help of every executable:" >> "$LOG"
            for b in $(find . -maxdepth 3 -type f -perm -u+x ! -name '*.so*'); do echo "### $b" >> "$LOG"; timeout 60 "$b" --help >> "$LOG" 2>&1 | head -25; done
          fi
          echo '```' >> "$LOG"
          cp "$LOG" "$OUT/REPORT.md"
      - name: Commit
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"; git config user.name craft-demo; git config user.email actions@users.noreply.github.com
          git add craft-demo && git commit -m "CI: wordcraft probe" || true; git push || true

