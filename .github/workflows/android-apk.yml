name: Build villa viewer APK

# Produces an installable APK from this repo, with the model packed into the APK as
# assets/model.vpk. Nothing is downloaded except the Android SDK/AGP themselves.

on:
  push:
    # Tag pushes are how a release asset gets built: `release` and `workflow_dispatch`
    # events only run workflow files that exist on the DEFAULT branch, and this one lives
    # on the work branch, whereas a tag push runs the workflow from the tagged commit.
    tags: ['villa-viewer-v*']
    paths:
      - 'android/**'
      - 'tools/villa_pack.py'
      - 'tools/vpk_preview.cpp'
      - 'villa_v2/*.glb'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tools/villa_pack.py'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the APK to this release tag (leave empty to only use artifacts)'
        required: false
        default: ''
  release:
    # 'created' is drafts, 'published' is a normal release - both should attach the APK
    types: [created, published]

# needed to attach the APK to a release; without it the upload step gets
# "Resource not accessible by integration"
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner image ships the Android SDK; only the platform/build-tools
      # that AGP wants may be missing, and sdkmanager can add those.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            "$SDKM" --list_installed | head -20 || true
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.3'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packer deps
        run: pip install --quiet numpy pillow

      # The lite GLB (256 px textures) is committed, so no Blender is needed here.
      - name: Pack the model for the viewer
        run: |
          set -euo pipefail
          test -f villa_v2/villa_v2_lite.glb || { echo "::error::villa_v2_lite.glb missing"; exit 1; }
          python tools/villa_pack.py villa_v2/villa_v2_lite.glb \
            -o android/viewer/app/src/main/assets/model.vpk \
            --json-out /tmp/pack.json
          python tools/verify_pack.py /tmp/pack.json --tris 500000 --max-mb 60
          ls -l android/viewer/app/src/main/assets/model.vpk

      # Real verification, not a smoke test: the SAME loader and shading code the app uses
      # is compiled for the host and rasterised in software, so a broken pack fails here.
      - name: Verify the pack by rendering it (host build of the app's loader)
        run: |
          set -euo pipefail
          g++ -O2 -std=c++17 tools/vpk_preview.cpp \
              android/viewer/app/src/main/cpp/vpk.cpp \
              -Iandroid/viewer/app/src/main/cpp -o /tmp/vpkpreview
          /tmp/vpkpreview android/viewer/app/src/main/assets/model.vpk /tmp/front.ppm 0 10 0
          /tmp/vpkpreview android/viewer/app/src/main/assets/model.vpk /tmp/garden.ppm 210 8 0
          python -c "from PIL import Image; Image.open('/tmp/front.ppm').save('/tmp/front.png'); Image.open('/tmp/garden.ppm').save('/tmp/garden.png')"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle -p android/viewer --no-daemon --console=plain --stacktrace assembleDebug \
            2>&1 | tee /tmp/gradle.log

      # Artifact storage is not always reachable from a reviewer's sandbox, so the useful
      # part of the build log is re-emitted as check-run annotations as well.
      - name: Surface build errors
        if: failure()
        run: |
          set +e
          grep -E "error:|error \[|Unresolved|FAILURE:|Caused by|What went wrong|Could not" \
            /tmp/gradle.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Report APK size
        run: |
          set -euo pipefail
          f=android/viewer/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$f"
          cp "$f" villa-viewer.apk
          { echo "### villa-viewer.apk"; echo; echo "size: $(du -h villa-viewer.apk | cut -f1)"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: villa-viewer-apk
          path: villa-viewer.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: pack-preview
          path: |
            /tmp/front.png
            /tmp/garden.png
            /tmp/pack.json
          if-no-files-found: error

      # A public release asset is a far friendlier download than a login-gated workflow
      # artifact: on a tablet you can tap the link and install.
      - name: Attach APK to a release
        if: github.event_name == 'release' || inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: villa-viewer.apk
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
