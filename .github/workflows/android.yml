name: Build jcode for Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build jcode for Android arm64
        shell: bash
        run: |
          set -o pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export CARGO_BUILD_RUSTC_WRAPPER=""
          cd vendor/jcode
          cargo build --locked --release --no-default-features --bin jcode --target aarch64-linux-android -j 3 2>&1 | tee "$RUNNER_TEMP/jcode-build.log" || {
            tail -100 "$RUNNER_TEMP/jcode-build.log" | sed 's/%/%25/g; s/\r/%0D/g; s/$/%0A/' | tr -d '\n' | sed 's/^/::error::/'
            exit 1
          }
