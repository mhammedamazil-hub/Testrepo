name: craft-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect real Crafting App CLIs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "# Crafting App CLI probe (runner: ubuntu-latest)" > "$GITHUB_WORKSPACE/probe-report.md"
          probe() {
            local repo="$1" tag="$2" pat="$3" label="$4"
            local dir="/tmp/$label"; mkdir -p "$dir"; cd "$dir" || return
            echo "" >> "$GITHUB_WORKSPACE/probe-report.md"
            echo "## $label (storytold/$repo @ $tag)" >> "$GITHUB_WORKSPACE/probe-report.md"
            if ! gh release download "$tag" -R "storytold/$repo" -p "$pat" -D . --clobber; then
              echo "- download FAILED" >> "$GITHUB_WORKSPACE/probe-report.md"; return
            fi
            ls -lh . | tail -3 >> "$GITHUB_WORKSPACE/probe-report.md"
            local tgz; tgz=$(ls *.tar.gz 2>/dev/null | head -1)
            [ -z "$tgz" ] && { echo "- no tar.gz" >> "$GITHUB_WORKSPACE/probe-report.md"; return; }
            tar xzf "$tgz" || true
            echo "" >> "$GITHUB_WORKSPACE/probe-report.md"
            echo "top-level:" >> "$GITHUB_WORKSPACE/probe-report.md"
            find . -maxdepth 2 | head -25 >> "$GITHUB_WORKSPACE/probe-report.md"
            local bins; bins=$(find . -maxdepth 4 -type f -perm -u+x | grep -vE '\.so' | head -8)
            echo "" >> "$GITHUB_WORKSPACE/probe-report.md"; echo "executables:" >> "$GITHUB_WORKSPACE/probe-report.md"
            echo "$bins" >> "$GITHUB_WORKSPACE/probe-report.md"
            for b in $bins; do
              case "$b" in *lib*|*.so*) continue;; esac
              echo "" >> "$GITHUB_WORKSPACE/probe-report.md"
              echo "- \`$b --version\`:" >> "$GITHUB_WORKSPACE/probe-report.md"
              ( "$b" --version 2>&1 | head -3 ) >> "$GITHUB_WORKSPACE/probe-report.md"
              echo "- \`$b --help\` (first 25 lines):" >> "$GITHUB_WORKSPACE/probe-report.md"
              echo '```' >> "$GITHUB_WORKSPACE/probe-report.md"
              ( timeout 60 "$b" --help 2>&1 | head -25 ) >> "$GITHUB_WORKSPACE/probe-report.md"
              echo '```' >> "$GITHUB_WORKSPACE/probe-report.md"
            done
          }
          probe photocraft v0.23.1 '*linux-x86_64.tar.gz' photocraft
          probe gridcraft "$(gh release list -R storytold/gridcraft --limit 1 --json tagName --jq '.[0].tagName')" '*linux-x86_64.tar.gz' gridcraft
      - name: Commit report back to the branch
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "craft-probe"
          git config user.email "actions@users.noreply.github.com"
          git add probe-report.md
          git commit -m "CI probe: real Crafting App CLIs on a Linux runner" || true
          git push || true
