name: craft-probe2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe CLIs (robust)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REP="$GITHUB_WORKSPACE/probe-report.md"
          { echo "# Crafting App CLI probe"; echo; echo "runner: $(uname -srm)"; } > "$REP"
          probe () {
            repo="$1"; tag="$2"; pat="$3"; label="$4"
            dir="/tmp/$label"; rm -rf "$dir"; mkdir -p "$dir"; cd "$dir" || return 0
            { echo; echo "## $label — storytold/$repo @ $tag"; } >> "$REP"
            gh release download "$tag" -R "storytold/$repo" -p "$pat" -D . --clobber >>"$REP" 2>&1 || { echo "- download FAILED" >> "$REP"; return 0; }
            ls -lh . >> "$REP" 2>&1
            tgz=$(ls *.tar.gz 2>/dev/null | head -1)
            [ -z "$tgz" ] && { echo "- no tar.gz asset" >> "$REP"; return 0; }
            tar xzf "$tgz" >>"$REP" 2>&1 || true
            echo; echo '```'; find . -maxdepth 3 | head -30; echo '```' >> "$REP"
            find . -maxdepth 3 | head -30 >> "$REP" 2>&1
            for b in $(find . -maxdepth 4 -type f -perm -u+x ! -name '*.so*' | head -6); do
              { echo; echo "### $b"; echo '```'; } >> "$REP"
              timeout 90 "$b" --version >>"$REP" 2>&1 || echo "(version exited $?)" >> "$REP"
              timeout 90 "$b" --help >>"$REP" 2>&1 | head -40 || true
              echo '```' >> "$REP"
            done
          }
          probe photocraft v0.23.1 '*linux-x86_64.tar.gz' photocraft || true
          probe gridcraft   v0.19.1 '*linux-x86_64.tar.gz' gridcraft   || true
          { echo; echo "## headless smoke"; ls ~/.cache 2>/dev/null | head -5; } >> "$REP"
          echo "PROBE_DONE"
      - name: Commit report
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name craft-probe
          git config user.email actions@users.noreply.github.com
          git add probe-report.md && git commit -m "CI probe report" || true
          git push || true
