name: craft-demo-pdf
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: PdfCraft headless on real PDFs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exec 2>&1
          OUT="$GITHUB_WORKSPACE/craft-demo"; mkdir -p "$OUT"
          LOG="$OUT/REPORT-pdfcraft.md"
          echo "# PdfCraft headless run" > "$LOG"; echo '```' >> "$LOG"
          cd /tmp; rm -rf pd; mkdir pd; cd pd
          gh release download v0.21.1 -R storytold/pdfcraft -p '*linux-x86_64.tar.gz' -D . >> "$LOG" 2>&1
          ls -l >> "$LOG"
          tar xzf ./*.tar.gz >> "$LOG" 2>&1; echo "[tar exit $?]" >> "$LOG"
          PD=$(find /tmp/pd -maxdepth 4 -type f -name 'pdfcraft-cli' | head -1)
          echo "binary: $PD" >> "$LOG"
          run () { echo "\$ $*" >> "$LOG"; timeout 200 "$@" >> "$LOG" 2>&1; echo "[exit $?]" >> "$LOG"; }
          run "$PD" --version
          run "$PD" --help
          run "$PD" info "$OUT/gridcraft-ledger.pdf" --json
          run "$PD" info "$OUT/vectorcraft-badge.pdf" --json
          run "$PD" merge "$OUT/gridcraft-ledger.pdf" "$OUT/vectorcraft-badge.pdf" --out "$OUT/pdfcraft-merged.pdf"
          run "$PD" info "$OUT/pdfcraft-merged.pdf" --json
          run "$PD" text "$OUT/vectorcraft-badge.pdf"
          echo '```' >> "$LOG"
          ls -l "$OUT" >> "$LOG" 2>&1
      - name: Commit
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"; git config user.name craft-demo; git config user.email actions@users.noreply.github.com
          git add craft-demo && git commit -m "CI: pdfcraft artifacts" || true; git push || true
