name: Alpine After Dark validation and publication
on:
  push:
    branches: [arena/f0bb5c2d-testrepo]
    paths:
      - engine/**
      - game/assets/**
      - game/CREDITS.md
      - docs/game/after-dark/**
      - docs/game/circuit-v3/**
      - docs/game/beyond-road-v4/**
      - docs/game/time-attack-v5/**
      - docs/game/multiplayer-v6/**
      - docs/game/mountain-v7/**
      - tests/test_multiplayer_release.py
      - tests/test_short_hop.py
      - tests/test_beyond_road.py
      - tests/test_circuit_release.py
      - roadster_lite.glb
      - tools/game/**
      - tests/test_game_project.py
      - tests/test_library_runtime.py
      - tests/test_after_dark.py
      - .github/workflows/game-build.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpine-game-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 Pillow==13.0.0 imageio-ffmpeg==0.8.1
      - name: Validate source, asset provenance and social metadata
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Test real dynamic vehicle physics and build standalone game
        run: |
          npm ci --prefix engine
          npm test --prefix engine
          node engine/tests/circuit-drive.js
          node engine/tests/grand-prix-drive.js
          npm run build --prefix engine
      - name: Make the custom game the main site and retain its previous URL
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source=Path('.exports/alpine');site=Path('.exports/pages')
          shutil.copytree(source,site)
          shutil.copytree(source,site/'alpine')
          (site/'.nojekyll').touch()
          assert (site/'social/after-dark-time-attack-v5.jpg').is_file()
          assert (site/'design.html').is_file()
          assert (site/'world/mountain/alpine-massif.glb').is_file()
          assert len(list((site/'design-reference').glob('*.jpg')))==10
          html=(site/'index.html').read_text()
          assert 'og:image' in html and 'Alpine: After Dark' in html
          shutil.make_archive('.exports/Alpine_After_Dark_Web','zip',source)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .exports/pages
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: Alpine-After-Dark-playable-Web
          path: .exports/Alpine_After_Dark_Web.zip
          retention-days: 3
  deploy-pages:
    name: Publish and verify custom Roadster game
    needs: validate-and-export
    if: github.ref == 'refs/heads/arena/f0bb5c2d-testrepo'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Check public raw HTML, bundles, real model and crawler image
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os,re,urllib.request,json,hashlib
          base=os.environ['PAGES_URL'].rstrip('/')+'/'
          def read(name):
              url=base+name+('?release='+os.environ['GITHUB_SHA'])
              request=urllib.request.Request(url,headers={'User-Agent':'Discordbot/2.0 (Alpine release smoke check)','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=90) as r:
                  assert r.status==200,name
                  return r.read(),r.headers.get_content_type()
          html,_=read('');html=html.decode()
          assert 'Alpine: After Dark' in html and 'property="og:image"' in html
          assert 'twitter:card' in html and 'summary_large_image' in html
          bundle=re.search(r'<script[^>]+src="([^"]+)"',html).group(1)
          assert len(read(bundle)[0])>10000
          image,mime=read('social/after-dark-time-attack-v5.jpg');assert mime=='image/jpeg' and image[:2]==b'\xff\xd8'
          model,_=read('world/roadster/roadster.glb');assert model[:4]==b'glTF'
          meta=json.loads(read('world/roadster/model.json')[0]);assert meta['license']=='CC-BY-4.0'
          route=json.loads(read('world/track/route.json')[0]);assert route['width']==10 and len(route['points'])==640
          grass=json.loads(read('world/meadow/grass.json')[0]);assert len(grass)>10000
          assert 'FINITE THRUSTER HOPS' in html and 'boost-control' in html and 'trial-best' in html
          assert 'steering-wheel' in html and 'gas-pedal' in html and 'brake-pedal' in html
          assert 'Alpine: After Dark' in read('alpine/')[0].decode()
          online=read('multiplayer.html')[0].decode();assert 'guest-name' in online and 'start-race' in online and 'chat-message' in online
          assert 'multiplayer.html' in html
          low=read('world/grand-prix/roadster-low.glb')[0];assert low[:4]==b'glTF' and len(low)<4500000
          online_image,mime=read('social/grand-prix-v6.jpg');assert mime=='image/jpeg' and online_image[:2]==b'\xff\xd8'
          workshop=read('design.html')[0].decode()
          assert 'car-preview' in workshop and 'driver' in workshop and 'WORK IN PROGRESS' in workshop
          workshop_bundle=re.search(r'<script[^>]+src="([^"]+)"',workshop).group(1)
          assert len(read(workshop_bundle)[0])>1000
          massif=read('world/mountain/alpine-massif.glb')[0];assert massif[:4]==b'glTF'
          manifest=json.loads(read('world/mountain/manifest.json')[0])
          assert hashlib.sha256(massif).hexdigest()==manifest['sha256'] and len(manifest['meshes'])==240
          for reference in ['01-mountain-world','02-guest-live-car','03-room-lobby','04-desktop-race','05-mobile-race','06-track-map','07-race-results','08-settings','09-pause-connection','10-solo-home-garage']:
              image,mime=read('design-reference/'+reference+'.jpg');assert mime=='image/jpeg' and image[:2]==b'\xff\xd8'
          assert 'practice-drive' in online and 'design.html' in online
          assert 'car-preview' in read('alpine/design.html')[0].decode()
          print('CUSTOM_GAME_WORKSHOP_MOUNTAIN_REFERENCES_AND_MULTIPLAYER_HTTPS_PASS',base)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## Play Alpine: After Dark\n\n'+base+'\n\nRoot and /alpine/ serve the custom game. Raw Open Graph metadata, JPEG crawler image, JS bundle and actual Roadster GLB verified. Multiplayer HTML and low-car asset are published. Visual Workshop: '+base+'design.html is published with its JS bundle, ten concept images and hash-verified Blender mountain GLB. Terrain/UI remain work in progress, not photorealism approval. Public PeerJS signalling/cross-NAT reachability is not certified by this HTTP smoke check. Not a physical-phone/60 FPS certificate.\n')
          PY
