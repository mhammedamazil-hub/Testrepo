name: Alpine game validation and Web build
on:
  push:
    branches: [arena/f0bb5c2d-testrepo]
    paths:
      - game/**
      - tools/game/**
      - tests/test_game_project.py
      - .github/workflows/game-build.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpine-game-${{ github.ref }}
  # Do not interrupt an in-flight Pages deployment with a newer push.
  cancel-in-progress: false
jobs:
  validate-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies only
        run: python -m pip install numpy==1.26.4 Pillow==13.0.0 imageio-ffmpeg==0.8.1
      - name: Restore verified official Godot and Web templates
        run: python tools/game/setup_toolchain.py
      - name: Import actual game assets
        run: .cache/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --editor --import
      - name: Test actual Godot physics, walking, driving and interactions
        shell: bash
        run: |
          set -euo pipefail
          .cache/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --fixed-fps 60 --script res://tests/physics_smoke.gd | tee /tmp/game-physics.log
          grep -q GAMEPLAY_SMOKE_PASS /tmp/game-physics.log
      - name: Test source, evidence and production/recovery safeguards
        run: python -m unittest discover -s tests -v
      - name: Export actual single-threaded Godot Web release
        run: python tools/game/export_game.py
      - name: Prepare static GitHub Pages site
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('.exports/web')
          site = Path('.exports/pages')
          assert 'variant/thread_support=false' in Path('game/export_presets.cfg').read_text(), 'Pages cannot set COOP/COEP headers for a threaded build'
          # Pages sets its own compression headers. Do not ship sidecars that
          # need the custom preview server's Content-Encoding handling.
          shutil.copytree(source, site, ignore=shutil.ignore_patterns('*.gz'))
          (site / '.nojekyll').touch()
          assert (site / 'index.html').is_file()
          assert (site / 'index.wasm').stat().st_size < 100 * 1024 * 1024
          PY
      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .exports/pages
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: Alpine-Mirror-playable-Web
          path: |
            .exports/Alpine_Mirror_Web.zip
            .exports/web-export.json
            docs/game/headless-validation.json
          include-hidden-files: true
          retention-days: 3
  deploy-pages:
    name: Publish playable game to GitHub Pages
    needs: validate-and-export
    if: github.ref == 'refs/heads/arena/f0bb5c2d-testrepo'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy playable Godot Web export
        id: deployment
        uses: actions/deploy-pages@v4
