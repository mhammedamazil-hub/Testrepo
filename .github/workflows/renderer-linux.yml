name: Reality Renderer - Linux Build & Test

on:
  push:
    branches: [arena/67bc2899-testrepo, main]
  pull_request:
    branches: [arena/67bc2899-testrepo, main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "=== Workspace ==="
          pwd
          ls -la
          echo "=== Tools ==="
          which cmake || echo "cmake not found"
          which make || echo "make not found"
          which g++ || echo "g++ not found"
          cmake --version || true
          make --version | head -1 || true
          g++ --version | head -1 || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libstdc++-12-dev \
            libvulkan1 libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            glslang-tools spirv-tools libgl1-mesa-dev libx11-dev \
            xvfb libxi-dev libglvnd-dev

      - name: Clone Vulkan-Headers
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git third_party/Vulkan-Headers
          ls -la third_party/Vulkan-Headers/include/vulkan/vulkan.h

      - name: Clone Vulkan-Loader
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Loader.git third_party/Vulkan-Loader

      - name: CMake configure
        run: |
          mkdir -p build
          cd build
          cmake ../engine -DCMAKE_BUILD_TYPE=Release

      - name: Build test_vulkan_execution
        run: |
          cd build
          make -j2 test_vulkan_execution

      - name: Compile GLSL shaders to SPIR-V
        run: |
          python3 scripts/compile_shaders.py /usr/bin/glslangValidator || true

      - name: Validate SPIR-V with spirv-val
        run: |
          if command -v spirv-val &>/dev/null; then
            echo "Validating vertex shader SPIR-V..."
            spirv-val engine/rendering/vulkan/shaders/pbr.vert.spv && echo "Vertex shader SPIR-V valid"
            echo "Validating fragment shader SPIR-V..."
            spirv-val engine/rendering/vulkan/shaders/pbr.frag.spv && echo "Fragment shader SPIR-V valid"
          else
            echo "spirv-val not available, skipping SPIR-V validation"
          fi
        continue-on-error: true

      - name: Run Vulkan execution test
        continue-on-error: true
        run: |
          echo "=== Build directory contents ==="
          ls -la build/bin/ 2>/dev/null || echo "No build/bin directory"
          echo "=== Installed Vulkan packages ==="
          dpkg -l | grep -i vulkan 2>/dev/null || echo "dpkg not available"
          echo "=== Vulkan libraries ==="
          ldconfig -p | grep -i vulkan 2>/dev/null || echo "ldconfig not available"
          echo "=== Vulkan ICD files ==="
          ls -la /usr/share/vulkan/icd.d/ 2>/dev/null || echo "No ICD directory"
          echo "=== Finding lavapipe ICD ==="
          find /usr -name "*lvp*" -o -name "*lavapipe*" 2>/dev/null || echo "No lavapipe found"
          echo "=== Finding libvulkan ==="
          find / -name "libvulkan*" 2>/dev/null | head -10 || echo "No libvulkan found"
          echo "=== vulkaninfo ==="
          vulkaninfo --summary 2>&1 | head -30 || echo "vulkaninfo failed"
          echo "=== Running test with lavapipe ICD ==="
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          cd build
          ./bin/test_vulkan_execution || echo "Test exited with code: $?"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-renderer-linux
          path: |
            build/bin/test_vulkan_execution
          retention-days: 3
