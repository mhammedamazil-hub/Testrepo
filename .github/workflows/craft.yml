name: craft-assets

# The agent sandbox has no egress to the Craft release CDN, so pi-craft cannot
# provision FigCraft / DeckCraft / EffectCraft there. This runner can. It downloads
# the real CLIs, builds the assets from the scripts committed in studio/, verifies
# them with `pi-craft verify`, and commits the outputs back to the repository.
#
# Nothing here is a stub: if the binaries fail to provision the job fails.
#
# Trigger: push to studio/craft/** or dispatch manually. Publishes to
# studio/site/assets/craft/ and studio/craft/out/.

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Space-separated apps to provision'
        default: 'figcraft deckcraft effectcraft'
  push:
    paths:
      - 'studio/craft/**'
      - '.github/workflows/craft.yml'

permissions:
  contents: write

concurrency:
  group: craft-assets
  cancel-in-progress: true

jobs:
  craft:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pi-craft
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i @blackbelt-technology/pi-dashboard-craft-apps@0.11.0 --no-audit --no-fund
          npx pi-craft status --json

      # ffprobe/pdftoppm back `pi-craft verify`; without them every media assertion
      # exits 3 and the checks silently become skips.
      - name: Media probes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg poppler-utils
          ffprobe -version | head -1
          pdftoppm -v 2>&1 | head -1

      - name: Provision the craft CLIs
        id: provision
        run: |
          set -euo pipefail
          # GITHUB_TOKEN lifts the anonymous REST limit that "latest" resolution needs
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          apps="${{ github.event.inputs.apps || 'figcraft deckcraft effectcraft' }}"
          for a in $apps; do
            echo "::group::pi-craft $a ensure"
            npx pi-craft "$a" ensure | tee "/tmp/$a.json"
            echo "::endgroup::"
          done
          npx pi-craft status --json > /tmp/status.json || true
          cat /tmp/status.json

      # Not fatal: if a version probe is spelled differently in this release, the
      # build steps below are the real test. This step just puts the versions in
      # the log.
      - name: Probe the binaries
        continue-on-error: true
        run: |
          for a in figcraft deckcraft effectcraft; do
            echo "::group::$a"
            npx pi-craft "$a" exec --version || npx pi-craft "$a" exec version || true
            echo "::endgroup::"
          done

      # ── the actual builds. Each reads a script in studio/craft/ and writes an
      #    artefact. The scripts are the source of truth and are committed.
      - name: Build — FigCraft screens
        run: |
          mkdir -p studio/craft/out
          LOG=studio/craft/out/figcraft.log
          exec 3>&1
          {
            npx pi-craft figcraft exec path || true
            npx pi-craft figcraft exec help || true
            npx pi-craft figcraft exec commands --filter frame.create || true
            npx pi-craft figcraft exec commands --filter text.create || true
          } 2>&1 | tee -a "$LOG" | while IFS= read -r l; do echo "$l"; done

          for s in studio/craft/figcraft/*.jsonl; do
            name=$(basename "$s" .jsonl)
            echo "### $name" >> "$LOG"
            npx pi-craft figcraft exec run "$s" --out "studio/craft/out/figcraft-$name.figcraft" 2>&1 | tee -a "$LOG"
            [ -f "studio/craft/out/figcraft-$name.figcraft" ] || { echo "run produced no document" >> "$LOG"; continue; }
            npx pi-craft figcraft exec info "studio/craft/out/figcraft-$name.figcraft" 2>&1 | tee -a "$LOG"
            npx pi-craft figcraft exec export "studio/craft/out/figcraft-$name.figcraft" \
              -o "studio/craft/out/figcraft-$name" --format png --scale 2 2>&1 | tee -a "$LOG"
          done
          ls -la studio/craft/out

      # DeckCraft's parameter surface differs from its skill docs in places; keep the
      # CLI's own answer in the repo instead of guessing.
      - name: DeckCraft schema
        if: always()
        run: |
          mkdir -p studio/craft/logs
          {
            for id in slide.new shape.insert insert.textBox insert.picture design.theme design.size file.new slide.background; do
              echo "### $id"
              npx pi-craft deckcraft exec describe "$id" 2>&1 || true
              echo
            done
            echo "### commands picture"
            npx pi-craft deckcraft exec commands picture 2>&1 | head -40 || true
            echo "### commands theme"
            npx pi-craft deckcraft exec commands theme 2>&1 | head -40 || true
            echo "### commands background"
            npx pi-craft deckcraft exec commands background 2>&1 | head -40 || true
            echo "### commands textBox / text formatting"
            npx pi-craft deckcraft exec commands text 2>&1 | head -60 || true
            echo "### commands number"
            npx pi-craft deckcraft exec commands slideNumber 2>&1 | head -20 || true
          } > studio/craft/logs/deckcraft-schema.txt
          head -40 studio/craft/logs/deckcraft-schema.txt
          exit 0

      - name: Build — DeckCraft
        if: always()
        run: |
          # one subshell: bash -e would otherwise abort the step the moment node
          # exits non-zero, and the log would never be copied anywhere
          set +e
          mkdir -p studio/craft/out studio/craft/logs
          node studio/craft/deckcraft/build.mjs > /tmp/deck.log 2>&1
          echo "EXIT=$?" >> /tmp/deck.log
          cp /tmp/deck.log studio/craft/logs/deckcraft.log
          tail -90 /tmp/deck.log
          ls -la studio/craft/out
          exit 0

      # DeckCraft composes the deck; DeckWriter writes the .pptx that gets sent, with
      # real fonts and colours on every run (DeckCraft has no text-formatting command).
      - name: Write the shipped deck (DeckWriter)
        if: always()
        run: |
          set +e
          mkdir -p studio/craft/out
          SCRIPT=studio/craft/out/kiln-deck.script.txt
          if [ ! -f "$SCRIPT" ]; then echo "no layout script produced"; exit 0; fi
          head -5 "$SCRIPT"
          java studio/craft/console/DeckWriter.java "$SCRIPT" studio/craft/out/kiln-deck.pptx > studio/craft/logs/deckwriter.log 2>&1 || true
          cat studio/craft/logs/deckwriter.log | tail -30
          ls -la studio/craft/out/kiln-deck.pptx 2>/dev/null || echo "DeckWriter produced nothing"
          exit 0

      - name: Render deck slides to png
        if: always()
        continue-on-error: true
        run: |
          [ -f studio/craft/out/kiln-deckcraft.pptx ] || { echo "no deck to render"; exit 0; }
          npx pi-craft deckcraft exec render studio/craft/out/kiln-deckcraft.pptx --all studio/craft/out/deck-slides --scale 1
          ls studio/craft/out/deck-slides | head

      - name: Build — EffectCraft
        if: always()
        run: |
          set +e
          mkdir -p studio/craft/out studio/craft/logs
          bash -x studio/craft/effectcraft/kiln-sting.sh > /tmp/ec.log 2>&1
          echo "EXIT=$?" >> /tmp/ec.log
          cp /tmp/ec.log studio/craft/logs/effectcraft.log
          # dump the shape's real property paths even when the build failed
          if [ -f studio/craft/out/kiln-sting.ecproj ]; then
            npx pi-craft effectcraft exec --project studio/craft/out/kiln-sting.ecproj props - Rule --flat 2>&1 | tee -a /tmp/ec.log
          fi
          tail -30 /tmp/ec.log
          ls -la studio/craft/out
          exit 0

      - name: Verify the artefacts
        if: always()
        run: bash studio/craft/verify.sh 2>&1 | tee studio/craft/out/verify.log

      # A ProRes 4444 overlay is tens of megabytes and does not belong in git history.
      # Everything over ~5 MB goes to the run's artefacts instead, where it can be
      # downloaded and handed to an editor.
      - name: Upload heavy artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craft-heavy
          path: |
            studio/craft/out/kiln-sting-alpha.mov
            studio/craft/out/kiln-deckcraft.pptx
            studio/craft/out/*.ecproj
            studio/craft/out/*.figcraft
            studio/craft/out/*.log
            studio/craft/out/*.json
            studio/craft/out/kiln-deck.pptx
            studio/craft/out/kiln-deck.script.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish into the site
        if: always()
        run: |
          set -euo pipefail
          mkdir -p studio/site/assets/craft
          # web-weight files only; sources and masters stay in craft/out or the artefacts
          find studio/craft/out -maxdepth 2 -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.svg' -o -name '*.webm' -o -name '*.mp4' -o -name '*.pdf' \) \
            -size -4M -exec cp -v {} studio/site/assets/craft/ \;
          du -sh studio/site/assets/craft

      # Logs and JSON reports are the only way to read a failed run from a sandbox
      # that cannot reach the Actions log or artefact CDNs, so they are committed.
      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name "kiln-craft"
          git config user.email "studio@kiln.studio"
          mkdir -p studio/craft/logs
          cp -f studio/craft/out/*.log studio/craft/out/*.json studio/craft/logs/ 2>/dev/null || true
          git add -f studio/craft/logs
          git diff --cached --quiet || git commit -m "craft: diagnostics from CI run ${{ github.run_id }}"
          git push || true

      - name: Commit
        if: always()
        run: |
          git config user.name "kiln-craft"
          git config user.email "studio@kiln.studio"
          # commit only what git should carry: the deck pdf, the mp4, the poster,
          # the rendered slides and frames, and the JSON reports
          # -A, not an explicit list: one missing path makes the whole `git add` fail
          git add -A studio/craft/out studio/site/assets/craft
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -F - <<'MSG'
          craft: build FigCraft / DeckCraft / EffectCraft artefacts in CI

          Generated by .github/workflows/craft.yml from the scripts in studio/craft/.
          The agent sandbox cannot reach the release CDN, so the real CLIs run here
          and the outputs are committed back.
          MSG
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "# craft-assets"
            echo
            echo '```'
            cat /tmp/status.json 2>/dev/null || echo "no status"
            echo '```'
            echo
            echo "## artefacts"
            echo '```'
            find studio/craft/out studio/site/assets/craft -type f -printf '%10s  %p\n' 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
