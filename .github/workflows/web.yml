name: Browser UI tests
on:
  push:
    branches: [arena/26f76d74-testrepo]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # REA is independent of these tests; do not execute dependency install hooks.
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - run: npm run build:web
      - run: git diff --exit-code -- web/astryx.js web/astryx.css web/UI-LICENSES.txt src/themes/sourcebook/sourcebook.css src/themes/sourcebook/sourcebook.js src/themes/sourcebook/sourcebook.d.ts
      - run: npm run check:design
      - run: node --check web/app.js
      - run: npm run test:web
