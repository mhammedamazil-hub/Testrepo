name: craft-pdf-final
on:
  push:
    paths: ["craft-trigger.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: PdfCraft headless combine, extract, render, text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exec 2>&1
          OUT="$GITHUB_WORKSPACE/craft-suite"; LOG="$OUT/REPORT-pdfcraft.md"
          echo "# PdfCraft 0.21.1 headless: info, combine, extract, render, text" > "$LOG"; echo '```' >> "$LOG"
          cd /tmp; rm -rf pd; mkdir pd; cd pd
          gh release download v0.21.1 -R storytold/pdfcraft -p '*linux-x86_64.tar.gz' -D . >> "$LOG" 2>&1
          for f in *.tar.gz; do case "$f" in pdfcraft-cli-*) tar xzf "$f" >> "$LOG" 2>&1;; esac; done
          PD=/tmp/pd/pdfcraft-cli-0.21.1-linux-x86_64/pdfcraft-cli
          A="$GITHUB_WORKSPACE/craft-demo/gridcraft-ledger.pdf"; B="$OUT/figcraft-card.pdf"
          run () { echo "\$ $*" >> "$LOG"; timeout 200 "$@" >> "$LOG" 2>&1; echo "[exit $?]" >> "$LOG"; }
          run "$PD" info "$A"
          run "$PD" info "$B"
          run "$PD" combine "$A" "$B" --out "$OUT/pdfcraft-combined.pdf"
          run "$PD" info "$OUT/pdfcraft-combined.pdf"
          run "$PD" extract "$OUT/pdfcraft-combined.pdf" --pages 2 --out "$OUT/pdfcraft-page2.pdf"
          run "$PD" render "$OUT/pdfcraft-page2.pdf" --page 1 --dpi 96 --out "$OUT/pdfcraft-page2.png"
          run "$PD" text "$OUT/pdfcraft-page2.pdf"
          run "$PD" audit "$OUT/pdfcraft-combined.pdf"
          echo '```' >> "$LOG"
          ls -l "$OUT" >> "$LOG" 2>&1
      - name: Commit
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"; git config user.name craft-suite; git config user.email actions@users.noreply.github.com
          git add craft-suite && git commit -m "CI: pdfcraft combine/extract/render" || true; git push || true
