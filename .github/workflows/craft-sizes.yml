name: craft-sizes
on: workflow_dispatch
jobs:
  photocraft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Measure photocraft CLI payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp; mkdir w; cd w
          gh release download v0.23.1 -R storytold/photocraft -p '*linux-x86_64.tar.gz' -D . 2>/dev/null
          echo "asset sizes:"; ls -l *.tar.gz | awk '{print $5, $9}'
          for f in *.tar.gz; do case "$f" in *server*) continue;; esac; tar tzf "$f" | grep -E 'bin/[^/]*$' ; done
          echo "--- extract only bin/ ---"
          for f in *.tar.gz; do case "$f" in *server*) continue;; esac; tar xzf "$f" --wildcards '*/bin/*' 2>/dev/null; done
          find . -path '*/bin/*' -type f -exec ls -l {} \; | awk '{print $5, $9}' | sort -n
          echo "--- cli only, gzipped size ---"
          for b in $(find . -path '*/bin/*-cli' -type f); do cp "$b" /tmp/cli_$(basename "$b"); gzip -9 -c "$b" | wc -c | xargs echo "$(basename $b) gz_bytes:"; done

