name: craft-sizes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Measure every CLI payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exec 2>&1
          REP="$GITHUB_WORKSPACE/craft-sizes.md"
          echo "| app | tag | tarball | bin/* files | file size | gzip -9 size |" > "$REP"
          echo "|---|---|---|---|---|---|" >> "$REP"
          set +e
          for pair in             "photocraft v0.23.1" \
            "vectorcraft v0.24.1" \
            "filmcraft v0.20.1" \
            "lightcraft v0.21.1" \
            "pdfcraft v0.21.1" \
            "effectcraft v0.24.1" \
            "designcraft v0.20.1" \
            "figcraft v0.18.1" \
            "wordcraft v0.18.1" \
            "soundcraft v0.20.1" \
            "deckcraft v0.18.1" \
            "cadcraft v0.20.1" \
            "gridcraft v0.19.1"
          do
            set -- $pair; app=$1; tag=$2
            rm -rf /tmp/w; mkdir -p /tmp/w; cd /tmp/w
            gh release download "$tag" -R "storytold/$app" -p '*linux-x86_64.tar.gz' -D . 2>/dev/null
            tb=$(ls *.tar.gz 2>/dev/null | head -1)
            tbsz=$(stat -c%s "$tb" 2>/dev/null)
            for f in *.tar.gz; do case "$f" in *server*) continue;; esac; tar xzf "$f" --wildcards '*/bin/*' 2>/dev/null; done
            files=""
            for b in $(find . -path '*/bin/*' -type f | sort); do
              sz=$(stat -c%s "$b"); gz=$(gzip -9 -c "$b" | wc -c)
              files="$files<br>$(basename $b) ($sz B / gz $gz B)"
            done
            echo "| $app | $tag | $tb ($tbsz) | $files | - | - |" >> "$REP"
            cd /tmp
          done
          cat "$REP"
      - name: Commit sizes report
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"; git config user.name craft-sizes; git config user.email actions@users.noreply.github.com
          git pull --rebase || true
          git add craft-sizes.md && git commit -m "CI: CLI payload sizes" || true; git push || true
