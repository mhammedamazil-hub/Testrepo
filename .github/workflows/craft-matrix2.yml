name: craft-matrix2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  wordcraft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: wordcraft CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exec 2>&1
          OUT="$GITHUB_WORKSPACE/craft-demo/wordcraft"; mkdir -p "$OUT"
          LOG="$OUT/REPORT.md"
          echo "# wordcraft v0.18.1 headless CLI" > "$LOG"; echo '```' >> "$LOG"
          cd /tmp; rm -rf wordcraft; mkdir wordcraft; cd wordcraft
          gh release download v0.18.1 -R storytold/wordcraft -p '*linux-x86_64.tar.gz' -D . >> "$LOG" 2>&1
          for f in *.tar.gz; do echo "--- $f ---" >> "$LOG"; tar tzf "$f" 2>/dev/null | head -6 >> "$LOG"; tar xzf "$f" >> "$LOG" 2>&1; done
          find . -maxdepth 4 -type f -perm -u+x ! -name '*.so*' >> "$LOG" 2>&1
          for b in $(find . -maxdepth 4 -type f -perm -u+x ! -name '*.so*' | head -4); do
            echo "" >> "$LOG"; echo "### $b --version" >> "$LOG"
            timeout 120 "$b" --version >> "$LOG" 2>&1; echo "[exit $?]" >> "$LOG"
            echo "### $b --help (trimmed)" >> "$LOG"
            timeout 120 "$b" --help 2>&1 | head -22 >> "$LOG"
          done
          echo '```' >> "$LOG"
      - name: Commit
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"; git config user.name craft-demo; git config user.email actions@users.noreply.github.com
          git add craft-demo && git commit -m "CI: wordcraft cli report" || true; git push || true

