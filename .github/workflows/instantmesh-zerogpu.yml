name: InstantMesh ZeroGPU validation

# Why this workflow exists
# -----------------------
# GitHub-hosted standard runners have NO GPU, and GPU runners are paid-only
# ($0.052/min, Team/Enterprise + a card on file). So this workflow does not try
# to compute the inference locally. Runners DO have open egress, so instead it
# drives the free ZeroGPU Space, brings the real mesh back, verifies it, renders
# turntable frames with an independent software renderer, and uploads artifacts.
#
# Cost: $0. Public repo => standard runners are free and unlimited. The Space
# spends free ZeroGPU quota (~2 GPU-min/day anonymous, ~5 authenticated).
#
# Trigger: `push` as well as `workflow_dispatch`, because dispatch requires
# Actions:write which the current GitHub connection does not have.

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Direct URL of the input photograph (jpg/png)"
        required: false
        default: "https://commons.wikimedia.org/wiki/Special:FilePath/BMW%20M5%20F90%20Competition%20(51585150351).jpg?width=1280"
      seed:
        description: "Sampling seed"
        required: false
        default: "42"
      steps:
        description: "Diffusion steps (30-75)"
        required: false
        default: "30"
  push:
    branches: [arena/bd775bb6-testrepo]
    paths:
      - ".github/workflows/instantmesh-zerogpu.yml"
      - "tools/hfspace_inference.py"

permissions:
  contents: write   # needed to commit results back (artifact download is blocked in the audit sandbox)

jobs:
  zerogpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner environment and egress diagnostics
        run: |
          echo "=== runner ==="
          uname -srm
          nproc
          free -h | head -2
          df -h / | tail -1
          echo "=== GPU (expected: none on standard runners) ==="
          nvidia-smi 2>&1 | head -3 || echo "no nvidia-smi (as expected on standard runners)"
          echo "=== egress matrix (this is what the sandbox could not do) ==="
          for url in https://github.com \
                     https://pypi.org \
                     https://huggingface.co \
                     https://tencentarc-instantmesh.hf.space/config \
                     https://api.replicate.com \
                     https://colab.research.google.com \
                     https://www.kaggle.com ; do
            code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "$url" || echo "ERR")
            echo "  $url -> $code"
          done

      - name: Install client and verifier dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "gradio_client==1.14.0" pillow

      - name: Fetch input photograph
        env:
          IMAGE_URL: ${{ github.event.inputs.image_url || 'https://commons.wikimedia.org/wiki/Special:FilePath/BMW%20M5%20F90%20Competition%20(51585150351).jpg?width=1280' }}
        run: |
          set -u
          mkdir -p work
          fetch() {
            url="$1"
            code=$(curl -sSL -m 180 --retry 2 -w "%{http_code}" \
                        -A "instantmesh-ci/1.0 (research; github actions)" \
                        "$url" -o work/input.jpg 2>/dev/null || echo ERR)
            size=$(wc -c < work/input.jpg 2>/dev/null || echo 0)
            echo "  http=$code size=$size  $url"
            [ "$code" = "200" ] && [ "$size" -gt 10000 ]
          }
          fetch "$IMAGE_URL" \
            || fetch "https://commons.wikimedia.org/wiki/Special:FilePath/BMW%20F90%20M5%20Competition%20(47090285514).jpg?width=1280" \
            || fetch "https://raw.githubusercontent.com/TencentARC/InstantMesh/main/examples/fox.jpg" \
            || { echo "could not fetch any input image"; exit 1; }

      - name: Validate input decodes
        run: |
          python -c "from PIL import Image; im=Image.open('work/input.jpg'); im.load(); print('input', im.size, im.mode); assert min(im.size)>=300, 'image too small'"

      - name: Run InstantMesh on the free ZeroGPU Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: TencentARC/InstantMesh
        run: |
          python tools/hfspace_inference.py \
            --image work/input.jpg \
            --out work/out \
            --steps "${{ github.event.inputs.steps || '30' }}" \
            --seed "${{ github.event.inputs.seed || '42' }}"
        continue-on-error: true

      - name: Verify the GLB structurally and render turntable frames
        if: always()
        run: |
          set -u
          echo "=== metrics ==="
          cat work/out/metrics.json 2>/dev/null || echo "no metrics.json (driver did not finish)"
          GLB=$(ls work/out/*.glb 2>/dev/null | head -1 || true)
          if [ -n "${GLB:-}" ]; then
            echo "=== inspect $GLB ==="
            python tools/verify_mesh.py inspect "$GLB" | tee work/inspect.json || true
            echo "=== render ==="
            python tools/verify_mesh.py render "$GLB" --out work/renders --frames 6 --width 400 --height 300 | tee work/render.json || true
          else
            echo "No GLB produced, so there is nothing to verify."
          fi

      - name: Publish results into the repository
        if: always()
        run: |
          set -u
          git config user.name "instantmesh-ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p ci_results
          cp -r work/out/. ci_results/ 2>/dev/null || true
          cp -r work/renders ci_results/renders 2>/dev/null || true
          cp work/input.jpg ci_results/input.jpg 2>/dev/null || true
          cp work/inspect.json ci_results/inspect.json 2>/dev/null || true
          cp work/render.json ci_results/render.json 2>/dev/null || true
          echo "{\"run_id\": \"${{ github.run_id }}\", \"sha\": \"${{ github.sha }}\", \"server\": \"${{ github.server_url }}\"}" > ci_results/run.json
          ls -laR ci_results | head -40
          git add -A ci_results
          git commit -m "ci: InstantMesh ZeroGPU results from run ${{ github.run_id }}" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed (non-fatal; artifacts still uploaded)"

      - name: Upload mesh, renders and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instantmesh-zerogpu-${{ github.run_id }}
          path: |
            work/out/**
            work/renders/**
            work/input.jpg
          if-no-files-found: warn
          retention-days: 30
