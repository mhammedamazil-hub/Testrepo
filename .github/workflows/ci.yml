name: CI Testing

on:
  push:
    branches: [arena/67bc2899-testrepo, main]
  pull_request:
    branches: [arena/67bc2899-testrepo, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet scons  # needed for Godot source builds if ever required

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run CLI smoke tests
        run: |
          python -m universal_engine --json version
          python -m universal_engine --json adapters
          python -m universal_engine --json project create ci-test-project --path /tmp/ci-test
          python -m universal_engine --json project inspect --path /tmp/ci-test
          python -m universal_engine --json project validate --path /tmp/ci-test
          python -m universal_engine --json game create ci-game --path /tmp/ci-game
          test -f /tmp/ci-game/project.godot
          test -f /tmp/ci-game/scenes/Main.tscn
          test -f /tmp/ci-game/scripts/Player.gd
          test -f /tmp/ci-game/scripts/GameManager.gd
          test -f /tmp/ci-game/scripts/Collectible.gd

      - name: Run MCP server smoke test
        run: |
          python3 -c "
import json, subprocess, sys
def mpc_msg(method, params=None, mid=1):
    m = {'jsonrpc': '2.0', 'id': mid, 'method': method}
    if params is not None:
        m['params'] = params
    s = json.dumps(m)
    return f'Content-Length: {len(s)}\r\n\r\n{s}'.encode()
data = b''.join([
    mpc_msg('initialize', {}, 1),
    mpc_msg('tools/list', {}, 2),
])
proc = subprocess.run([sys.executable, '-m', 'universal_engine.mcp_server'], input=data, capture_output=True, timeout=15)
assert proc.returncode == 0, proc.stderr
assert b'project_create' in proc.stdout
assert b'scene_create' in proc.stdout
assert b'game_create' in proc.stdout
print('MCP smoke test passed')
"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            /tmp/ci-game/
            /tmp/ci-test/
          retention-days: 1
