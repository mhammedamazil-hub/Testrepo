name: craft-final
on: workflow_dispatch
permissions:
  contents: write
jobs:
  figcraft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: FigCraft headless design export
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exec 2>&1
          OUT="$GITHUB_WORKSPACE/craft-demo"; LOG="$OUT/REPORT-figcraft.md"
          echo "# FigCraft 0.18.1 — headless design file → PNG/PDF/SVG" > "$LOG"; echo '```' >> "$LOG"
          cd /tmp; rm -rf fg; mkdir fg; cd fg
          gh release download v0.18.1 -R storytold/figcraft -p '*linux-x86_64.tar.gz' -D . >> "$LOG" 2>&1
          for f in *.tar.gz; do case "$f" in *server*) echo "skip $f" >> "$LOG";; *) tar xzf "$f" >> "$LOG" 2>&1;; esac; done
          FC=$(find /tmp/fg -maxdepth 4 -name figcraft-cli -type f | head -1)
          run () { echo "\$ $*" >> "$LOG"; timeout 200 "$@" >> "$LOG" 2>&1; echo "[exit $?]" >> "$LOG"; }
          run "$FC" --version
          cat > /tmp/fg/card.json <<'JSON'
          {"name":"card","nodes":[{"type":"frame","id":"f1","name":"Card","x":0,"y":0,"width":480,"height":300,
            "fills":[{"type":"solid","color":"#0b0e14"}],
            "children":[{"type":"rect","id":"r1","name":"ring","x":150,"y":60,"width":180,"height":180,
              "fills":[{"type":"solid","color":"#00e5f0"}],
              "strokes":[],"cornerRadius":90}]}]}
          JSON
          run "$FC" info /tmp/fg/card.json
          run "$FC" render /tmp/fg/card.json "$OUT/figcraft-card.png"
          run "$FC" convert /tmp/fg/card.json "$OUT/figcraft-card.pdf"
          run "$FC" convert /tmp/fg/card.json /tmp/fg/card.svg
          run "$FC" commands
          echo '```' >> "$LOG"
          ls -l "$OUT" >> "$LOG" 2>&1
      - name: Commit
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"; git config user.name craft-demo; git config user.email actions@users.noreply.github.com
          git add craft-demo && git commit -m "CI: figcraft design export" || true; git push || true

  pdfcraft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: PdfCraft headless PDF ops
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exec 2>&1
          OUT="$GITHUB_WORKSPACE/craft-demo"; LOG="$OUT/REPORT-pdfcraft.md"
          echo "# PdfCraft 0.21.1 — headless PDF operations" > "$LOG"; echo '```' >> "$LOG"
          cd /tmp; rm -rf pd; mkdir pd; cd pd
          gh release download v0.21.1 -R storytold/pdfcraft -p '*linux-x86_64.tar.gz' -D . >> "$LOG" 2>&1
          for f in *.tar.gz; do case "$f" in pdfcraft-cli-*) tar xzf "$f" >> "$LOG" 2>&1;; esac; done
          PD=$(find /tmp/pd -maxdepth 4 -name 'pdfcraft-cli*' -type f -perm -u+x | head -1)
          echo "binary: $PD" >> "$LOG"
          run () { echo "\$ $*" >> "$LOG"; timeout 200 "$@" >> "$LOG" 2>&1; echo "[exit $?]" >> "$LOG"; }
          run "$PD" --version
          run "$PD" --help
          run "$PD" info "$OUT/gridcraft-ledger.pdf" --json
          run "$PD" merge "$OUT/gridcraft-ledger.pdf" "$OUT/vectorcraft-badge.pdf" --out "$OUT/pdfcraft-merged.pdf"
          run "$PD" info "$OUT/pdfcraft-merged.pdf" --json
          echo '```' >> "$LOG"
          ls -l "$OUT" >> "$LOG" 2>&1
      - name: Commit
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"; git config user.name craft-demo; git config user.email actions@users.noreply.github.com
          git add craft-demo && git commit -m "CI: pdfcraft merge" || true; git push || true
