name: Godot Validation

on:
  push:
    branches: [arena/67bc2899-testrepo, main]
  pull_request:
    branches: [arena/67bc2899-testrepo, main]
  workflow_dispatch:

jobs:
  godot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install X virtual framebuffer for headless rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 mesa-utils

      - name: Download Godot 4.7.2 Linux headless binary
        run: |
          mkdir -p tools
          curl -L -o tools/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -o tools/godot.zip -d tools/
          chmod +x tools/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_PATH=$PWD/tools/Godot_v4.7.2-stable_linux.x86_64" >> $GITHUB_ENV

      - name: Verify Godot installation
        run: |
          "$GODOT_PATH" --version
          "$GODOT_PATH" --headless --version

      - name: Generate test game via Universal Game Engine
        run: |
          python -m universal_engine --json game create godot-game --path /tmp/godot-game
          ls -la /tmp/godot-game/scripts/
          ls -la /tmp/godot-game/scenes/

      - name: Run Godot headless smoke test (project loads)
        run: |
          xvfb-run -a "$GODOT_PATH" --headless --path /tmp/godot-game --quit-after 1
          echo "Godot headless smoke test completed"

      - name: Run headless validation via engine CLI
        run: |
          GODOT_PATH="$GODOT_PATH" python -m universal_engine --json game test --path /tmp/godot-game --headless --timeout 30

      - name: Capture preview screenshot via engine CLI
        run: |
          GODOT_PATH="$GODOT_PATH" xvfb-run -a python -m universal_engine --json preview capture Main /tmp/godot-game/preview.png --path /tmp/godot-game --width 640 --height 480 || true
          if [ -f /tmp/godot-game/preview.png ]; then
            echo "Preview captured: $(wc -c < /tmp/godot-game/preview.png) bytes"
          else
            echo "Preview capture skipped (may require display drivers)"
          fi

      - name: Upload Godot logs and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-artifacts
          path: |
            /tmp/godot-game/builds/
            /tmp/godot-game/preview.png
          retention-days: 1
