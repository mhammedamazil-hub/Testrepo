name: site-shots

# The agent sandbox cannot download a browser, so visual verification of the
# LUMENFORGE site happens here: build a screenshot set in CI and commit it back
# so the images are visible in the repo.

on:
  workflow_dispatch:
  push:
    paths:
      - 'studio/site/**'
      - '.github/workflows/site-shots.yml'

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.49.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          cd studio/site
          python3 -m http.server 4173 --bind 127.0.0.1 &
          sleep 2
          curl -sfI http://127.0.0.1:4173/ | head -1
      - name: Diagnostics
        run: |
          curl -s http://127.0.0.1:4173/ | head -20
          echo '--- css rules containing max-width ---'
      - name: Capture
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          fs.mkdirSync('studio/site/shots', { recursive: true });
          (async () => {
            const browser = await chromium.launch();
            const shot = async (url, file, opts) => {
              // newPage takes { viewport }, not a bare { width, height }: nesting it
              // wrong silently falls back to 1280x720, so every "mobile" shot is a
              // desktop shot and the media queries never run.
              const page = await browser.newPage({ viewport: opts.viewport, deviceScaleFactor: 1 });
              await page.goto(url, { waitUntil: 'networkidle' });
              await page.waitForTimeout(opts.wait || 2500);
              // full-page captures do not scroll, so scroll-driven reveals never fire.
              // walk the page first, then return to the top.
              if (opts.full) {
                // a sticky nav paints at the scroll position in a full-page capture;
                // park it so the composition is readable
                await page.addStyleTag({ content: '.nav{position:absolute !important}' });
                await page.evaluate(async () => {
                  const step = window.innerHeight * 0.8;
                  for (let y = 0; y < document.body.scrollHeight; y += step) {
                    window.scrollTo(0, y);
                    await new Promise((r) => setTimeout(r, 220));
                  }
                  window.scrollTo(0, 0);
                  await new Promise((r) => setTimeout(r, 500));
                });
              }
              await page.screenshot({ path: file, fullPage: !!opts.full });
              const diag = await page.evaluate(() => {
                const w = document.documentElement.scrollWidth;
                const bad = [...document.querySelectorAll('*')]
                  .map((el) => ({ el, r: el.getBoundingClientRect() }))
                  .filter(({ r }) => r.right > window.innerWidth + 2 || r.left < -2)
                  .slice(0, 8)
                  .map(({ el, r }) => `${el.tagName}.${el.className || ''} L${Math.round(r.left)} R${Math.round(r.right)} W${Math.round(r.width)}`);
                return { scrollWidth: w, viewport: window.innerWidth, offenders: bad };
              });
              console.log('DIAG', file, JSON.stringify(diag, null, 1));
              const stats = await page.evaluate(() => {
                const h = window.__lumenforge;
                return h ? { frames: h.frames(), calls: h.renderer.info.render.calls, tris: h.renderer.info.render.triangles } : null;
              });
              console.log(file, JSON.stringify(stats));
              await page.close();
            };
            const base = 'http://127.0.0.1:4173/';
            await shot(base, 'studio/site/shots/home-hero-1440x900.png', { viewport: { width: 1440, height: 900 } });
            await shot(base, 'studio/site/shots/home-full-1440.png', { viewport: { width: 1440, height: 900 }, full: true, wait: 4000 });
            await shot(base, 'studio/site/shots/home-mobile-390.png', { viewport: { width: 390, height: 844 }, full: true, wait: 3000 });
            await shot(base + 'showroom.html', 'studio/site/shots/showroom-1440x900.png', { viewport: { width: 1440, height: 900 }, wait: 3500 });
            await browser.close();
          })().catch((e) => { console.error(e); process.exit(1); });
          JS
      - name: Commit shots
        run: |
          git config user.name "lumenforge-ci"
          git config user.email "forge@lumenforge.studio"
          git add studio/site/shots
          git diff --cached --quiet || git commit -m "site: refresh screenshots from CI"
          git push
