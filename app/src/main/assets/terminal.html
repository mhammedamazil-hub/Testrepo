<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><link rel="stylesheet" href="xterm.css"><style>
html,body,#terminal{width:100%;height:100%;margin:0;background:#0b1119;overflow:hidden} .xterm{padding:4px;box-sizing:border-box;height:100%}
</style></head><body><div id="terminal"></div><script src="xterm.js"></script><script src="addon-fit.js"></script><script>
const term = new Terminal({cursorBlink:true, fontSize:14, fontFamily:'monospace', scrollback:5000, theme:{background:'#0b1119', foreground:'#dce8ee', cursor:'#80cbc4'}});
const fit = new FitAddon.FitAddon(); term.loadAddon(fit); term.open(document.getElementById('terminal'));
function resize(){ try { fit.fit(); Android.resize(term.cols,term.rows); } catch(e){} }
term.onData(data => Android.send(data));
window.addEventListener('resize',resize); new ResizeObserver(resize).observe(document.getElementById('terminal'));
window.receive = function(b64){const raw=atob(b64);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);term.write(bytes)};
window.focusTerminal = function(){term.focus()};
window.resetTerminal = function(){term.reset();resize()};
resize(); term.focus();
</script></body></html>
